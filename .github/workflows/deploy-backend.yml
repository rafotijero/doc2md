# Publica la carpeta backend/ en el Space de Hugging Face cuando cambia.
# Requiere el secreto HF_TOKEN (token de escritura de huggingface.co) y la
# variable HF_SPACE (por ejemplo "rafotijero/doc2md") en el repo de GitHub.
name: Deploy backend a Hugging Face

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Subir backend/ al Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix backend -b hf-space
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-space:main
